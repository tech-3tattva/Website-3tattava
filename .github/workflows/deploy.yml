name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            cd /home/ubuntu/Website-3tattava
            git pull origin main
            cd backend
            npm install --production
            pm2 restart 3tattava-api --update-env
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:5000/api/health >/dev/null 2>&1 || curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
                echo "Deployment successful!"; exit 0
              fi
              echo "waiting for backend to come up ($i/20)..."; sleep 3
            done
            echo "Backend health check failed after retries"; exit 1
