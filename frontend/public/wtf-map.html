// Custom amber marker SVG
function createMarkerIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 44" width="32" height="44">
    <defs>
      <radialGradient id="g" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#e4a84a"/>
        <stop offset="100%" stop-color="#9a6015"/>
      </radialGradient>
    </defs>
    <path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 28 16 28S32 28 32 16C32 7.163 24.837 0 16 0z" fill="url(#g)"/>
    <circle cx="16" cy="16" r="6" fill="#1c1304"/>
    <circle cx="14" cy="14" r="2" fill="rgba(255,255,255,0.35)" />
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [28, 40],
    iconAnchor: [14, 40],
    popupAnchor: [0, -42],
  });
}

const map = L.map('map', {
  center: [28.58, 77.22],
  zoom: 11,
  zoomControl: true,
  scrollWheelZoom: false,
  attributionControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const icon = createMarkerIcon('#cd872a');

centers.forEach(function(c) {
  const popup = `
    <div style="padding:14px 16px 12px">
      <p style="font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#cd872a;font-weight:700;margin-bottom:5px">${c.city}</p>
      <p style="font-size:13px;font-weight:700;color:#f7f0e2;line-height:1.3;margin-bottom:6px">${c.name}</p>
      <p style="font-size:11px;color:rgba(247,240,226,0.55);line-height:1.5;margin-bottom:10px">${c.address}</p>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}" target="_blank"
        style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#cd872a;text-decoration:none;font-weight:700">
        Open in Maps →
      </a>
    </div>`;
  L.marker([c.lat, c.lng], { icon: icon }).addTo(map).bindPopup(popup);
});

// Counter badge
const badge = document.createElement('div');
badge.className = 'counter-badge';
badge.textContent = centers.length + ' CENTERS';
document.body.appendChild(badge);
